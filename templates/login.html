<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Placement Tracker Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: url("../static/images/img1.jpeg") no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: 'Segoe UI', sans-serif;
    }
    header {
      background-color: #003366cc;
      color: white;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    nav a {
      color: white;
      margin-left: 15px;
      text-decoration: none;
      font-weight: 500;
    }
    nav a:hover {
      color: #ffc107;
    }
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }
    .login-box {
      background-color: rgba(255,255,255,0.95);
      color: #003366;
      border-radius: 10px;
      padding: 2rem;
      box-shadow: 0 0 15px rgba(0,0,0,0.4);
      width: 100%;
      max-width: 400px;
      position: relative;
    }
    .show-btn {
      position: absolute;
      right: 10px;
      top: 38px;
      padding: 0 8px;
      cursor: pointer;
      font-size: 0.85rem;
      color: #003366;
      background-color: #f1f1f1;
      border: none;
      border-radius: 5px;
    }
    .btn-primary {
      width: 100%;
    }
    footer {
      background-color: #003366cc;
      color: white;
      text-align: center;
      padding: 0.5rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">Placement Tracker</div>
    <nav>
      <a href="{{ url_for('home') }}">Home</a>
      <a href="{{ url_for('student_check') }}">Student Management</a>
      <a href="{{ url_for('login') }}">Admin</a>
      <a href="{{ url_for('register') }}">Register</a>
    </nav>
  </header>

  <main>
    <div class="login-box">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
              {{ message }}
              <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}
      <form method="POST" action="{{ url_for('login') }}">
        <div class="mb-3">
          <label>Username</label>
          <input type="text" name="username" class="form-control" placeholder="Enter your username" required>
        </div>
        <div class="mb-3 position-relative">
          <label>Password</label>
          <input type="password" name="password" id="password" class="form-control" placeholder="Enter your password" required>
          <button type="button" class="show-btn" onclick="togglePassword()">Show</button>
        </div>
        <button class="btn btn-primary mt-3" type="submit">Login</button>
      </form>
    </div>
  </main>

  <footer>
    &copy; 2025 Placement Tracker System
  </footer>

  <script>
    function togglePassword() {
      const pass = document.getElementById("password");
      pass.type = pass.type === "password" ? "text" : "password";
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
