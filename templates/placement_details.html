<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Enter Placement Details</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div class="container mt-5">
    <h2 class="mb-4">Enter Placement Details</h2>

    <!-- Admin Form to Enter Placement Info -->
   <form method="post">
  <!-- <div class="form-group">
    <label>Package</label>
    <input type="text" class="form-control" name="package" required>
  </div> -->
  <div class="form-group">
    <label>Role</label>
    <input type="text" class="form-control" name="role" required>
  </div>
  <div class="form-group">
    <label>Timing</label>
    <input type="text" class="form-control" name="timing" required>
  </div>
  <button type="submit" class="btn btn-success mt-3">Submit Placement Details</button>


      <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
</body>
</html>
