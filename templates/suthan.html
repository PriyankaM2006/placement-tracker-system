<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Company Records | Placement Tracker</title>
  <style>
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background: #f0f4f8;
      color: #333;
    }

   header {
      background-color: #003366;
      color: white;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 1rem;
      padding: 0;
      margin: 0;
    }

    nav a {
      text-decoration: none;
      color: white;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    nav a:hover {
      color: #ffc107;
    }

    main {
      max-width: 1000px;
      margin: 30px auto;
      padding: 20px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

     h2 {
      text-align: center;
      color: #004aad;
    }

    form {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 10px;
      margin-bottom: 20px;
      align-items: end;
    }

    form input {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    form button {
      padding: 10px 15px;
      background-color: #0073e6;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    form button:hover {
      background-color: #00aab6;
    }

    .tools {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .tools input {
      flex: 1;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #aaa;
    }

    .tools button {
      padding: 8px 14px;
      background: #333;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .tools button:hover {
      background: #222;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }

    th {
      background-color:white;
      color: white;
    }

    tr:hover {
      background-color: #f1f1f1;
    }

    .delete-btn {
      padding: 6px 10px;
      background: crimson;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .delete-btn:hover {
      background: darkred;
    }

    footer {
      background-color: #1565c0;
      color: white;
      text-align: center;
      padding: 20px;
      font-size: 14px;
      margin-top: 310px;
      width: 100%;

    }

    @media (max-width: 768px) {
      form {
        grid-template-columns: 1fr;
      }

      .tools {
        flex-direction: column;
      }
    }

  </style>
</head>
<body>

  <header>
    <div class="logo">Placement Tracker System</div>
 <nav>
  <ul>
    <li><a href="{{ url_for('home') }}">Home</a></li>
    <li><a href="{{ url_for('student_profile') }}">Student Management</a></li>
    <li><a href="{{ url_for('login') }}">Admin</a></li>
    <li><a href="{{ url_for('register') }}">Register</a></li>

  </ul>
</nav>

  </header>

  <main>
    <h2> Company Records</h2>

    <form id="companyForm">
      <input type="text" id="companyName" placeholder="Company Name" required />
      <input type="text" id="role" placeholder="Role Offered" required />
      <input type="number" id="package" placeholder="Package (LPA)" step="0.1" required />
      <button type="submit">Add</button>
    </form>

    <div class="tools">
      <input type="text" id="searchInput" placeholder="Search by company or role..." />
      <button onclick="toggleSort()">Sort by Package ⬍</button>
    </div>

    <!-- <table>
      <thead>
        <tr>
          <th>Company</th>
          <th>Role</th>
          <th>Package (LPA)</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="companyTableBody">
         JS will populate rows -->
      </tbody>
    </table> 
  </main>

  <footer>
    &copy; 2025 Placement Tracker System. All rights reserved.
  </footer>

  <script>
    const form = document.getElementById('companyForm');
    const tableBody = document.getElementById('companyTableBody');
    const searchInput = document.getElementById('searchInput');

    let companies = [];
    let sortAsc = true;

    form.addEventListener('submit', e => {
      e.preventDefault();

      const companyName = document.getElementById('companyName').value.trim();
      const role = document.getElementById('role').value.trim();
      const pkg = parseFloat(document.getElementById('package').value);

      if (!companyName || !role || isNaN(pkg)) return;

      companies.push({ companyName, role, pkg });
      renderTable();
      form.reset();
    });

    function renderTable() {
      const search = searchInput.value.toLowerCase();
      tableBody.innerHTML = '';

      companies
        .filter(c => c.companyName.toLowerCase().includes(search) || c.role.toLowerCase().includes(search))
        .forEach((c, index) => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${c.companyName}</td>
            <td>${c.role}</td>
            <td>${c.pkg.toFixed(1)}</td>
            <td><button class="delete-btn" onclick="deleteCompany(${index})">Delete</button></td>
          `;
          tableBody.appendChild(row);
        });
    }

    function deleteCompany(index) {
      companies.splice(index, 1);
      renderTable();
    }

    function toggleSort() {
      companies.sort((a, b) => sortAsc ? a.pkg - b.pkg : b.pkg - a.pkg);
      sortAsc = !sortAsc;
      renderTable();
    }

    searchInput.addEventListener('input', renderTable);
  </script>
</body>
</html>
