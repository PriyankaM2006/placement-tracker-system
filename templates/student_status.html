<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Status</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background-color: #e3f2fd;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      background-color: #003366;
      color: white;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    nav a {
      color: white;
      margin-left: 15px;
      text-decoration: none;
      font-weight: 500;
    }
    nav a:hover {
      color: #ffc107;
    }
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }
    .status-container {
      background-color: white;
      color: #003366;
      border-radius: 10px;
      max-width: 500px;
      width: 100%;
      padding: 2rem;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
      text-align: center;
    }
    .status {
      font-size: 1.5rem;
      font-weight: bold;
      margin-top: 1rem;
    }
    footer {
      background-color: #003366;
      color: white;
      text-align: center;
      padding: 0.5rem;
    }
  </style>
</head>
<body>
  <header>
    <h2>Placement Tracker System</h2>
    <nav class="d-flex flex-row">
      <a href="{{ url_for('home') }}">Home</a>
      <a href="{{ url_for('student_check') }}">Student Management</a>
      <a href="{{ url_for('login') }}">Admin</a>
      <a href="{{ url_for('register') }}">Register</a>
    </nav>
  </header>

  <main>
    <div class="status-container">
      {% if status %}
        <h2>Hello, {{ student.name }}</h2>
        <p>Your current registration status is:</p>
        <div class="status">{{ status }}</div>
      {% else %}
        <p>Sorry, status not found.</p>
      {% endif %}
      <a href="{{ url_for('student_options', student_id=student.student_id) }}" class="btn btn-primary mt-3">Back</a>
    </div>
  </main>

  <footer>
    &copy; 2025 Placement Tracker System
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
