<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Check Registration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #e3f2fd;
      background-image: url("../static/images/img13.avif");
      background-size: cover;
      background-position: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background-color: #003366;
      color: white;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: bold;
    }
    .navbar-nav a {
      color: white;
      margin-left: 15px;
      text-decoration: none;
      font-weight: 500;
    }
    .navbar-nav a:hover {
      color: #ffc107;
    }
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .main-title {
      font-size: 1.8rem;
      font-weight: bold;
      margin-bottom: 1rem;
      color: #09128f;
      background-color: rgb(218, 205, 205);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }
    .check-box {
      background-color: rgba(255,255,255,0.95);
      color: #003366;
      border-radius: 10px;
      padding: 2rem;
      box-shadow: 0 0 15px rgba(0,0,0,0.4);
      width: 100%;
      max-width: 400px;
      margin-top: 1rem;
    }
    .label-title {
      font-weight: bold;
      text-align: center;
      display: block;
      margin-bottom: 0.5rem;
      font-size: 1.1rem;
    }
    footer {
      background-color: #003366;
      color: white;
      text-align: center;
      padding: 0.5rem;
      font-size: 0.9rem;
      margin-top: auto;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">Placement Tracker System</div>
    <nav class="navbar-nav d-flex flex-row">
      <a href="{{ url_for('home') }}">Home</a>
      <a href="{{ url_for('student_check') }}">Student Management</a>
      <a href="{{ url_for('login') }}">Admin</a>
      <a href="{{ url_for('register') }}">Register</a>
    </nav>
  </header>

  <main class="main-content">
    <div class="main-title">Check Your Registration</div>
    <div class="check-box">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
              {{ message }}
              <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}
      <form method="POST" action="{{ url_for('student_check') }}">
        <div class="mb-3">
          <label class="label-title">Registration ID</label>
          <input type="text" name="student_id" class="form-control" placeholder="e.g. STU2025001" required>
        </div>
        <button class="btn btn-primary mt-2 w-100" type="submit">Check</button>
      </form>
    </div>
  </main>

  <footer>
    &copy; 2025 Placement Tracker System
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
